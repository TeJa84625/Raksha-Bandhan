<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Create Your Raksha Bandhan Card & QR</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #9d4edd;
            --secondary: #7b2cbf;
            --accent: #f72585;
            --gold: #f4d35e;
            --dark-bg: #07050a;
            --glass-bg: rgba(18, 14, 27, 0.94);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #f8f9fa;
            --text-muted: #adb5bd;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% 30%, #1c1033 0%, var(--dark-bg) 100%);
            color: var(--text-main);
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px;
            position: relative;
        }

        .ambient-glow {
            position: fixed;
            width: 60vw;
            height: 60vw;
            max-width: 400px;
            max-height: 400px;
            background: radial-gradient(circle, rgba(157, 78, 221, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        .card-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        .badge {
            align-self: center;
            background: rgba(244, 211, 94, 0.1);
            color: var(--gold);
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
            border: 1px solid rgba(244, 211, 94, 0.2);
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            text-align: center;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.78rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 16px;
        }

        .sub-container {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 14px 12px 6px 12px;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.73rem;
            color: var(--gold);
            margin-bottom: 5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            width: 100%;
            background: #14101f;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 10px 12px;
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f4d35e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 14px;
            padding-right: 35px;
            cursor: pointer;
        }

        select option {
            background-color: #1c152e;
            color: #f8f9fa;
            padding: 10px;
        }

        input[type="color"] {
            padding: 4px;
            height: 40px;
            cursor: pointer;
            background: #14101f;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row .form-group {
            flex: 1;
        }

        .checkbox-group {
            flex-direction: row;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .checkbox-group label {
            margin-bottom: 0;
            cursor: pointer;
            color: var(--text-main);
            font-size: 0.8rem;
        }

        .conditional-box {
            display: none;
            flex-direction: column;
        }

        .advanced-toggle {
            font-size: 0.76rem;
            color: var(--gold);
            background: none;
            border: none;
            cursor: pointer;
            text-align: left;
            margin: 4px 0 12px 4px;
            font-weight: 600;
            text-decoration: underline;
        }

        .advanced-section {
            display: none;
            flex-direction: column;
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 12px;
            border: 1px dashed rgba(244, 211, 94, 0.2);
            margin-bottom: 14px;
        }

        .btn-main {
            background: linear-gradient(135deg, var(--accent), var(--primary));
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 50px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(247, 37, 133, 0.4);
            width: 100%;
            text-align: center;
            text-decoration: none;
            margin-top: 6px;
            transition: opacity 0.2s;
        }

        .btn-main:active {
            opacity: 0.9;
        }

        .result-section {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 16px;
        }

        .footer {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 10px;
        }

        .footer strong { color: var(--gold); }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="card-container">
        <div class="badge">✨ Customizer Studio</div>
        <h1>Raksha Bandhan Studio</h1>
        <p class="subtitle">Design your card parameters & interactive QR code</p>

        <form id="cardForm" onsubmit="generateCard(event)">
            
            <div class="sub-container">
                <div class="row">
                    <div class="form-group">
                        <label>For Whom</label>
                        <select id="inputG">
                            <option value="m">Brother</option>
                            <option value="f">Sister</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Relation Age</label>
                        <select id="inputAg">
                            <option value="o">Elder</option>
                            <option value="y">Younger</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>Recipient Name</label>
                        <input type="text" id="inputT" placeholder="e.g. Rahul" required>
                    </div>
                    <div class="form-group">
                        <label>From Name</label>
                        <input type="text" id="inputF" placeholder="e.g. Priya" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Language</label>
                    <select id="inputL">
                        <option value="en">English</option>
                        <option value="hin">Hindi (हिंदी)</option>
                        <option value="tel">Telugu (తెలుగు)</option>
                        <option value="tam">Tamil (தமிழ்)</option>
                        <option value="kan">Kannada (ಕನ್ನಡ)</option>
                        <option value="mal">Malayalam (മലയാളം)</option>
                        <option value="ben">Bengali (বাংলা)</option>
                        <option value="mar">Marathi (मराठी)</option>
                    </select>
                </div>
            </div>

            <div class="sub-container">
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="enableCustomQuote" onchange="toggleCustomQuote()">
                    <label for="enableCustomQuote">Add Custom Quote?</label>
                </div>

                <div class="form-group conditional-box" id="customQuoteBox">
                    <label>Custom Quote Text</label>
                    <textarea id="inputQ" placeholder="Write your personalized heartfelt message..."></textarea>
                </div>

                <div class="form-group">
                    <label>Scratch Card Type</label>
                    <select id="scratchType" onchange="updateScratchInput()">
                        <option value="amount">Amount (INR ₹)</option>
                        <option value="msg">Message / Surprise Text</option>
                    </select>
                </div>

                <div class="form-group" id="scratchInputBox">
                    <label id="scratchLabel">Amount (INR)</label>
                    <input type="text" id="inputSc" placeholder="e.g. 500">
                </div>
            </div>

            <div class="sub-container">
                <div class="form-group">
                    <label>Interactive Gift/Action Type</label>
                    <select id="actionType" onchange="updateActionInputs()">
                        <option value="none">None</option>
                        <option value="call">Direct Call</option>
                        <option value="sms">SMS Draft</option>
                        <option value="whatsapp">WhatsApp Message</option>
                        <option value="upi">UPI Payment</option>
                        <option value="url">External URL / Link</option>
                    </select>
                </div>

                <div id="dynamicActionContainer"></div>
            </div>

            <button type="button" class="advanced-toggle" onclick="toggleAdvanced()">Advanced QR Styling (Colors, Style, Size, Logo)</button>
            
            <div class="advanced-section" id="advancedSection">
                <div class="row">
                    <div class="form-group">
                        <label>Foreground Color</label>
                        <input type="color" id="inputFg" value="#9d4edd">
                    </div>
                    <div class="form-group">
                        <label>Background Color</label>
                        <input type="color" id="inputBg" value="#ffffff">
                    </div>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>Pattern Style</label>
                        <select id="inputStyle">
                            <option value="default">Default (Rounded)</option>
                            <option value="dots">Dots</option>
                            <option value="square">Square</option>
                            <option value="grounded">Grounded</option>
                            <option value="classy">Classy</option>
                            <option value="classy-rounded">Classy Rounded</option>
                            <option value="extra-rounded">Extra Rounded</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Size (px)</label>
                        <input type="number" id="inputSize" value="400" min="150" max="1000">
                    </div>
                </div>

                <div class="form-group">
                    <label>Center Image (Logo URL)</label>
                    <input type="url" id="inputLogo" placeholder="https://example.com/logo.png">
                </div>
            </div>

            <button type="submit" class="btn-main">Create Card Actions ✨</button>
        </form>

        <div class="result-section" id="resultSection">
            <div class="row" style="width:100%; gap:8px;">
                <a href="#" id="previewCardBtn" target="_blank" class="btn-main" style="margin-top:0;">Open Card</a>
                <a href="#" id="downloadQRBtn" target="_blank" class="btn-main" style="margin-top:0; background: linear-gradient(135deg, #2b1847, #4b2184); text-align:center; display:flex; align-items:center; justify-content:center;">Download QR</a>
            </div>
        </div>
    </div>

    <div class="footer">Powered by <strong>QRZip & Raksha Bandhan</strong></div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            updateScratchInput();
            updateActionInputs();
        });

        function toggleCustomQuote() {
            const isChecked = document.getElementById('enableCustomQuote').checked;
            document.getElementById('customQuoteBox').style.display = isChecked ? 'flex' : 'none';
        }

        function updateScratchInput() {
            const type = document.getElementById('scratchType').value;
            const label = document.getElementById('scratchLabel');
            const input = document.getElementById('inputSc');
            
            input.value = '';

            if(type === 'amount') {
                label.innerText = "Scratch Amount (₹ INR)";
                input.placeholder = "e.g. 500";
            } else {
                label.innerText = "Scratch Message Content";
                input.placeholder = "e.g. Dinner on me tonight! 🍕";
            }
        }

        function updateActionInputs() {
            const action = document.getElementById('actionType').value;
            const container = document.getElementById('dynamicActionContainer');
            container.innerHTML = '';

            if (action === 'call') {
                container.innerHTML = `
                    <div class="form-group" style="margin-bottom:0;">
                        <label>Phone Number to Call</label>
                        <input type="tel" id="actionVal1" placeholder="+919876543210" required>
                    </div>`;
            } else if (action === 'sms' || action === 'whatsapp') {
                container.innerHTML = `
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="actionVal1" placeholder="+919876543210" required>
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label>Draft Message</label>
                        <input type="text" id="actionVal2" placeholder="Happy Rakhi!" required>
                    </div>`;
            } else if (action === 'upi') {
                container.innerHTML = `
                    <div class="form-group">
                        <label>UPI ID (VPA)</label>
                        <input type="text" id="actionVal1" placeholder="username@upi" required>
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label>Payment Amount (₹ INR)</label>
                        <input type="number" id="actionVal2" placeholder="500" required>
                    </div>`;
            } else if (action === 'url') {
                container.innerHTML = `
                    <div class="form-group" style="margin-bottom:0;">
                        <label>Redirect Target URL</label>
                        <input type="url" id="actionVal1" placeholder="https://example.com" required>
                    </div>`;
            }
        }

        function toggleAdvanced() {
            const section = document.getElementById('advancedSection');
            section.style.display = section.style.display === 'flex' ? 'none' : 'flex';
        }

        function generateCard(e) {
            e.preventDefault();

            const t = encodeURIComponent(document.getElementById('inputT').value.trim());
            const f = encodeURIComponent(document.getElementById('inputF').value.trim());
            const l = document.getElementById('inputL').value;
            const g = document.getElementById('inputG').value;
            const ag = document.getElementById('inputAg').value;
            
            let q = '';
            if(document.getElementById('enableCustomQuote').checked) {
                const qVal = document.getElementById('inputQ').value.trim();
                if(qVal) q = encodeURIComponent(qVal);
            }

            let scVal = document.getElementById('inputSc').value.trim();
            const scratchType = document.getElementById('scratchType').value;
            if(scratchType === 'amount' && scVal) {
                scVal = `₹ ${scVal} INR`;
            }
            const sc = encodeURIComponent(scVal);

            const action = document.getElementById('actionType').value;
            let targetRedirectUrl = '';

            const val1 = document.getElementById('actionVal1') ? document.getElementById('actionVal1').value.trim() : '';
            const val2 = document.getElementById('actionVal2') ? document.getElementById('actionVal2').value.trim() : '';
            const senderNameVal = document.getElementById('inputF').value.trim();

            if (action === 'call') {
                targetRedirectUrl = `tel:${val1}`;
            } else if (action === 'sms') {
                targetRedirectUrl = `sms:${val1}?body=${encodeURIComponent(val2)}`;
            } else if (action === 'whatsapp') {
                targetRedirectUrl = `https://wa.me/${val1}?text=${encodeURIComponent(val2)}`;
            } else if (action === 'upi') {
                const upiNote = encodeURIComponent(`Raksha Bandhan 2026 Gift from ${senderNameVal}`);
                targetRedirectUrl = `upi://pay?pa=${encodeURIComponent(val1)}&am=${encodeURIComponent(val2)}&cu=INR&tn=${upiNote}`;
            } else if (action === 'url') {
                targetRedirectUrl = val1;
            }

            const baseUrl = "https://raksha-bandhan-card.vercel.app/";
            
            let cardTargetUrl = `${baseUrl}?t=${t}&f=${f}&sc=${sc}&l=${l}&g=${g}&ag=${ag}`;
            if(q) cardTargetUrl += `&q=${q}`;
            if(targetRedirectUrl) {
                cardTargetUrl += `&u=${encodeURIComponent(targetRedirectUrl)}&d=${encodeURIComponent(targetRedirectUrl)}`;
            }
            cardTargetUrl += `&r=1`;

            // Set Open Card Link
            document.getElementById('previewCardBtn').href = cardTargetUrl;

            // Advanced Styling parameters setup
            const fg = document.getElementById('inputFg').value.replace('#', '');
            const bg = document.getElementById('inputBg').value.replace('#', '');
            const style = document.getElementById('inputStyle').value;
            const size = document.getElementById('inputSize').value;
            const logo = document.getElementById('inputLogo').value.trim();

            let apiParams = new URLSearchParams();
            apiParams.append('fg', fg);
            apiParams.append('bg', bg);
            if(style !== 'default') apiParams.append('style', style);
            if(size) apiParams.append('size', size);
            if(logo) apiParams.append('logo', encodeURIComponent(logo));

            // Construct exact qrzip.vercel.app/qrgen.html?d?url target link format
            const qrZipDownloadUrl = `https://qrzip.vercel.app/qrgen.html?${encodeURIComponent(cardTargetUrl)}&${apiParams.toString()}`;
            
            // Set Download QR Code Button Link
            document.getElementById('downloadQRBtn').href = qrZipDownloadUrl;

            document.getElementById('resultSection').style.display = 'flex';
            document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
